<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    font: 11px/1.4 Inter, system-ui, sans-serif;
    color: var(--figma-color-text, #222);
    background: var(--figma-color-bg, #fff);
  }
  .sel { padding: 8px 10px; border-radius: 6px; background: var(--figma-color-bg-secondary, #f5f5f5); margin-bottom: 10px; }
  .sel.bad { color: var(--figma-color-text-danger, #d22); }
  .row { display: flex; gap: 6px; margin-bottom: 10px; }
  .seg { display: flex; gap: 4px; margin: 2px 0 6px; }
  .seg button { height: 26px; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .seg button.on { border-color: var(--figma-color-border-brand-strong, #0d99ff); background: var(--figma-color-bg-brand-tertiary, #e5f4ff); }
  .seg svg { fill: currentColor; }
  button {
    flex: 1; height: 28px; border-radius: 6px; cursor: pointer;
    font: 500 11px Inter, system-ui, sans-serif;
    border: 1px solid var(--figma-color-border, #ddd);
    background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #222);
  }
  button.primary { background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); border-color: transparent; }
  button:disabled { opacity: .4; cursor: default; }
  .group { border: 1px solid var(--figma-color-border, #e5e5e5); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .title { font-weight: 600; margin-bottom: 4px; }
  .ctrl { display: grid; grid-template-columns: 92px 1fr 40px; align-items: center; gap: 6px; height: 24px; }
  .ctrl > span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--figma-color-text-secondary, #777); }
  .hint { color: var(--figma-color-text-secondary, #777); margin: -2px 0 2px 98px; font-size: 10px; }
  input[type=range] { width: 100%; accent-color: var(--figma-color-bg-brand, #0d99ff); }
  input[type=color] { width: 100%; height: 20px; padding: 1px; border: 1px solid var(--figma-color-border, #ddd); border-radius: 5px; background: none; cursor: pointer; }
  .check { display: flex; align-items: center; gap: 6px; height: 22px; }
  .status { min-height: 16px; color: var(--figma-color-text-secondary, #777); }
  .status.err { color: var(--figma-color-text-danger, #d22); }
  #plan { font-variant-numeric: tabular-nums; color: var(--figma-color-text-secondary, #777); margin-top: 2px; }
</style>

<div id="sel" class="sel bad">Выдели один фрейм</div>

<div class="row">
  <button data-preset="section">Секция</button>
  <button data-preset="button">Кнопка</button>
  <button data-preset="galaxy">Млечный путь</button>
</div>

<div class="group">
  <div class="title">Насыщенность</div>
  <div id="g-density"></div>
  <div id="plan"></div>
</div>

<div class="group">
  <div class="title">Точки</div>
  <div class="seg" id="shape">
    <button data-shape="dot"><svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3"/></svg>Круги</button>
    <button data-shape="sparkle"><svg width="10" height="10" viewBox="0 0 10 10"><path class="spk" d="M5 0Q6 4 10 5Q6 6 5 10Q4 6 0 5Q4 4 5 0Z"/></svg>Искры</button>
    <button data-shape="mix"><svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="2"/></svg><svg width="10" height="10" viewBox="0 0 10 10"><path class="spk" d="M5 0Q6 4 10 5Q6 6 5 10Q4 6 0 5Q4 4 5 0Z"/></svg>Микс</button>
  </div>
  <div id="g-dots"></div>
</div>

<div class="group">
  <div class="title">Расположение</div>
  <div id="g-place"></div>
</div>

<div class="group">
  <div class="title">Цвет</div>
  <div id="g-color"></div>
</div>

<label class="check"><input id="clip" type="checkbox"> Включить Clip content на фрейме</label>
<label class="check" style="margin-bottom:10px"><input id="live" type="checkbox" checked> Обновлять сразу при изменении</label>

<div class="row">
  <button id="gen" class="primary">Сгенерировать</button>
  <button id="shuffle">Перемешать</button>
  <button id="clear" style="flex:.6">Удалить</button>
</div>
<div id="status" class="status"></div>

<script>
  // Описание всех ползунков: ключ настройки, подпись, диапазон, формат, подсказка
  var CONTROLS = {
    'g-density': [
      ['density', 'Плотность', 0, 100, 1, function (x) { return x + '%'; }, '50% — как в образцах. Учитывает размер фрейма'],
      ['brightness', 'Яркость', 20, 150, 5, function (x) { return x + '%'; }]
    ],
    'g-dots': [
      ['size', 'Размер', 0.5, 3, 0.25, function (x) { return x + 'px'; }, 'Самые мелкие, дальние звёзды'],
      ['sizeSpread', 'Разброс размера', 1, 5, 0.25, function (x) { return '×' + x; }, '×1 — все одинаковые, ×3 — ближние втрое крупнее'],
      ['bigShare', 'Доля крупных', 0, 50, 1, function (x) { return x + '%'; }, 'Сколько звёзд крупные и размытые. Кнопка 33%, секция 10%'],
      ['blur', 'Размытие', 0, 4, 0.5, function (x) { return x; }, 'Layer blur ближних. От 2 размываются и средние'],
      ['sparkleCurve', 'Выпуклость искры', 2, 50, 1, function (x) { return x + '%'; }, '2% — иглы, 10% — как Telegram, 25% — ромб, выше — выпуклая']
    ],
    'g-place': [
      ['cluster', 'Кучность', 0, 100, 1, function (x) { return x + '%'; }, '0 — равномерно, выше — скопления полосой'],
      ['inset', 'Отступ от края', 0, 40, 1, function (x) { return x + 'px'; }]
    ],
    'g-color': [
      ['color', 'Основной', 'color'],
      ['accent', 'Акцент', 'color'],
      ['accentPct', 'Доля акцента', 0, 100, 1, function (x) { return x + '%'; }]
    ]
  };

  var presets = null, state = null, seed = newSeed();
  var selOk = false, selSize = null, active = false, touched = false, timer = null;
  var inputs = {};

  function newSeed() { return Math.floor(Math.random() * 1e9); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function $(id) { return document.getElementById(id); }
  function post(m) { parent.postMessage({ pluginMessage: m }, '*'); }

  function build() {
    Object.keys(CONTROLS).forEach(function (gid) {
      var box = $(gid);
      CONTROLS[gid].forEach(function (c) {
        var key = c[0];
        var row = document.createElement('div'); row.className = 'ctrl';
        var l = document.createElement('span'); l.textContent = c[1];
        var inp = document.createElement('input');
        var v = document.createElement('span');
        if (c[2] === 'color') {
          inp.type = 'color';
          inp.addEventListener('input', function () { state[key] = inp.value.toUpperCase(); changed(); });
        } else {
          inp.type = 'range'; inp.min = c[2]; inp.max = c[3]; inp.step = c[4];
          inp.addEventListener('input', function () { state[key] = Number(inp.value); v.textContent = c[5](state[key]); changed(); });
        }
        row.appendChild(l); row.appendChild(inp); row.appendChild(v);
        box.appendChild(row);
        if (c[6]) { var hn = document.createElement('div'); hn.className = 'hint'; hn.textContent = c[6]; box.appendChild(hn); }
        inputs[key] = { el: inp, val: v, fmt: c[5] };
      });
    });
  }

  // та же формула, что в code.js, — превью формы прямо в кнопке «Искры»
  function sparkleD(S, curve) {
    var t = Math.min(50, Math.max(0, curve)) / 100, c = S / 2, k = S * t;
    return 'M' + c + ' 0Q' + (c + k) + ' ' + (c - k) + ' ' + S + ' ' + c + 'Q' + (c + k) + ' ' + (c + k) + ' ' + c + ' ' + S +
      'Q' + (c - k) + ' ' + (c + k) + ' 0 ' + c + 'Q' + (c - k) + ' ' + (c - k) + ' ' + c + ' 0Z';
  }
  function drawSparkle() {
    Array.prototype.forEach.call(document.querySelectorAll('.spk'), function (el) { el.setAttribute('d', sparkleD(10, state.sparkleCurve)); });
  }

  function render() {
    // настройки, сохранённые прошлой версией плагина, без новых полей
    if (state.bigShare == null) state.bigShare = 10;
    if (state.midShare == null) state.midShare = 25;
    Object.keys(inputs).forEach(function (k) {
      var it = inputs[k];
      it.el.value = state[k];
      if (it.fmt) it.val.textContent = it.fmt(state[k]);
    });
    if (!state.shape) state.shape = 'dot';
    if (state.sparkleCurve == null) state.sparkleCurve = 10;
    // ползунок выпуклости нужен только когда есть искры
    var sc = inputs.sparkleCurve.el.parentNode;
    sc.style.display = sc.nextSibling.style.display = state.shape === 'dot' ? 'none' : '';
    drawSparkle();
    Array.prototype.forEach.call(document.querySelectorAll('[data-shape]'), function (b) {
      b.className = b.dataset.shape === state.shape ? 'on' : '';
    });
    $('clip').checked = !!state.clip;
    askPlan();
  }

  function askPlan() { if (selSize && state) post({ type: 'plan', settings: state, w: selSize[0], h: selSize[1] }); else $('plan').textContent = ''; }

  function loadPreset(name) { state = clone(presets[name]); touched = false; render(); }

  function apply() { if (selOk) { post({ type: 'apply', settings: state, seed: seed }); active = true; } }
  function changed() {
    touched = true;
    drawSparkle();
    askPlan();
    if (!$('live').checked || !active || !selOk) return;
    clearTimeout(timer);
    timer = setTimeout(apply, 120);
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-shape]'), function (b) {
    b.addEventListener('click', function () { state.shape = b.dataset.shape; render(); changed(); });
  });
  $('clip').addEventListener('change', function () { state.clip = this.checked; changed(); });
  $('gen').addEventListener('click', apply);
  $('shuffle').addEventListener('click', function () { seed = newSeed(); apply(); });
  $('clear').addEventListener('click', function () { post({ type: 'clear' }); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (b) {
    b.addEventListener('click', function () { loadPreset(b.dataset.preset); changed(); });
  });

  window.onmessage = function (e) {
    var m = e.data.pluginMessage;
    if (!m) return;
    if (m.type === 'presets') {
      presets = m.presets;
      if (!state) loadPreset('section');
    } else if (m.type === 'selection') {
      selOk = m.ok;
      selSize = m.ok ? [m.w, m.h] : null;
      $('sel').textContent = m.text;
      $('sel').className = 'sel' + (m.ok ? '' : ' bad');
      ['gen', 'shuffle', 'clear'].forEach(function (id) { $(id).disabled = !m.ok; });
      if (m.saved) { state = m.saved.settings; seed = m.saved.seed; active = true; touched = false; render(); }
      else {
        active = false;
        if (m.ok && presets && !touched) loadPreset(m.w < 400 && m.h < 200 ? 'button' : 'section');
        else askPlan();
      }
    } else if (m.type === 'plan') {
      if (!m.layers) return;
      var L = m.layers, sum = L[0].count + L[1].count + L[2].count;
      $('plan').textContent = '≈ ' + sum + ' звёзд: ' +
        L.filter(function (l) { return l.count > 0; }).map(function (l) { return l.count + (l.shape === 'sparkle' ? '✦' : '×') + l.size + 'px' + (l.blur ? ' b' + l.blur : ''); }).join(' · ');
    } else if (m.type === 'status') {
      $('status').textContent = m.text;
      $('status').className = 'status' + (m.error ? ' err' : '');
    }
  };

  build();
  post({ type: 'init' });
</script>
